name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_agent_check:
        description: "Also run a live Claude API smoke test (uses the ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Engine and API tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # No secrets needed: the agent is tested with a scripted fake client.
      - run: python -m pytest -q

  docker:
    name: Docker image builds
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t coalition-agents .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name coalition -p 8000:8000 coalition-agents
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 2; done
          docker logs coalition; exit 1

  live-agent:
    name: Live Claude smoke test (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.live_agent_check
    needs: test
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ask each agent one question against the seeded coalition
        run: |
          python - <<'EOF'
          from app.db import Base, SessionLocal, engine
          from app.seed import seed
          from app import agent
          Base.metadata.create_all(engine)
          questions = {"expertise": "Where are our biggest skill gaps?",
                       "grants": "Which funders fit the Farm-to-Distribution Traceability project?",
                       "resources": "Which resource requests are ready for a decision?"}
          with SessionLocal() as s:
              seed(s)
              for name, q in questions.items():
                  r = agent.ask(s, name, q)
                  print(f"--- {name}:", r["draft_answer"][:400])
                  print("tools:", [t["tool"] for t in r["tools_used"]], "grounded:", r["grounded"])
                  assert r["tools_used"], f"{name} answered without calling an engine"
          EOF
